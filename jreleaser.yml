project:
  name: qraven
  description: A fast build tool for Maven projects that generates self-contained build scripts
  links:
    homepage: https://github.com/FroMage/qraven
  license: Apache-2.0
  authors:
    - Stéphane Épardaud
  languages:
    java:
      groupId: io.github.fromage.qraven
      version: 17

signing:
  active: ALWAYS
  armored: true

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        retryDelay: 60
        maxRetries: 120
        stagingRepositories:
          - target/staging-deploy

release:
  github:
    tagName: "{{projectVersion}}"
    overwrite: true
    changelog:
      formatted: ALWAYS
      preset: conventional-commits
