name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set release version
        run: mvn versions:set -DnewVersion=${{ github.event.inputs.version }} -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B install -DskipTests

      - name: Stage artifacts for JReleaser
        run: mvn -B deploy -DaltDeploymentRepository=local::file:./target/staging-deploy -DskipTests

      - name: Run JReleaser
        run: mvn -B jreleaser:full-release -N
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}

      - name: Bump to next SNAPSHOT version
        run: |
          IFS='.' read -r major minor patch <<< "${{ github.event.inputs.version }}"
          if [ -n "$patch" ]; then
            next="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          else
            next="${major}.$((minor + 1))-SNAPSHOT"
          fi
          git checkout -- .
          mvn versions:set -DnewVersion="$next" -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml cli/pom.xml runtime/pom.xml
          git commit -m "Bump version to $next"
          git push

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: target/jreleaser/
