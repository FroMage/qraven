name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave empty to use POM version without -SNAPSHOT)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Determine release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "release=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            v=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            echo "release=${v%-SNAPSHOT}" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing version: $(grep release "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Set release version
        run: mvn versions:set -DnewVersion=${{ steps.version.outputs.release }} -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B install -DskipTests

      - name: Stage artifacts for JReleaser
        run: mvn -B deploy -DaltDeploymentRepository=local::file:./target/staging-deploy -DskipTests

      - name: Run JReleaser
        run: mvn -B jreleaser:full-release -N
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}

      - name: Bump to next SNAPSHOT version
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.version.outputs.release }}"
          if [ -n "$patch" ]; then
            next="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          else
            next="${major}.$((minor + 1))-SNAPSHOT"
          fi
          git checkout -- .
          mvn versions:set -DnewVersion="$next" -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -a -m "Bump version to $next"
          git push

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: target/jreleaser/
